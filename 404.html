<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Writely</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center;
         background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; padding: 24px; }
  .card { background: rgba(255,255,255,.12); backdrop-filter: blur(10px);
          padding: 48px 32px; border-radius: 24px; max-width: 420px; text-align: center;
          border: 1px solid rgba(255,255,255,.2); }
  h1 { font-size: 96px; margin: 0; font-weight: 800; letter-spacing: -2px; }
  h2 { font-size: 22px; margin: 8px 0 12px; font-weight: 600; }
  p { opacity: .85; line-height: 1.55; margin: 0 0 24px; }
  a.btn { display: inline-block; background: #fff; color: #6366f1; text-decoration: none;
          padding: 12px 24px; border-radius: 10px; font-weight: 600; }
  a.btn:hover { transform: translateY(-2px); transition: .15s; }
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="/">Go home</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
    <script src="../../shared/utils/logic.js" defer></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--ink-tint);
            color: var(--ink-purple);
        }
        .chat-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            background: white;
            height: 100%;
        }
        .chat-sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .chat-list-item {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-list-item:hover, .chat-list-item.active {
            background: var(--bg-secondary);
        }
        .chat-main {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #F8FAFC;
        }
        .chat-header {
            padding: 20px 32px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message-sent {
            align-self: flex-end;
            background: var(--ink-purple);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-received {
            align-self: flex-start;
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 24px 32px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
        }
        .chat-input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            outline: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo">
                <div class="logo-mark">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="projects.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    My Projects
                </a>
                <a href="messages.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="wallet.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                    Wallet
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="settings.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile Settings
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="chat-container">
            <div class="chat-sidebar" id="chatSidebar">
                <div style="padding: 24px; border-bottom: 1px solid var(--border);">
                    <h3 style="font-weight: 700;">Chats</h3>
                </div>
                <div id="chatListContainer" style="overflow-y: auto;">
                    <div style="padding:20px; text-align:center; color:var(--text-tertiary);">Loading chats...</div>
                </div>
            </div>

            <div class="chat-main">
                <div class="chat-header">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div>
                            <div style="font-weight: 700;" id="currentChatName">Select a chat</div>
                        </div>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div style="text-align:center; color:var(--text-tertiary); margin-top: 40px;">Select an assignment from your projects to view messages.</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." disabled>
                    <button class="btn btn-primary" id="sendBtn" style="padding: 12px 24px;" onclick="sendMessage()" disabled>Send</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        let currentUserId = null;
        let currentAssignmentId = null;

        document.addEventListener("DOMContentLoaded", () => {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    loadChatList(user.uid);
                } else {
                    window.location.href = 'index.html';
                }
            });

            document.getElementById('chatInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') sendMessage();
            });
        });

        async function loadChatList(userId) {
            try {
                // Fetch active assignments for this user to list as chat channels
                const snapshot = await firebase.firestore().collection('assignments')
                    .where('seekerId', '==', userId)
                    .where('status', '==', 'ACTIVE')
                    .get();

                const container = document.getElementById('chatListContainer');
                if (snapshot.empty) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-tertiary);">No active chats.</div>';
                    return;
                }

                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const job = doc.data();
                    container.innerHTML += `
                        <div class="chat-list-item" onclick="openChat('${doc.id}', '${job.title}')">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <div style="width:40px; height:40px; border-radius:50%; background:var(--ink-purple); color:white; display:flex; align-items:center; justify-content:center; font-weight:700;">W</div>
                                <div>
                                    <div style="font-weight: 600; font-size: 14px;">${job.title}</div>
                                    <div style="font-size: 12px; color: var(--text-tertiary);">Writer Assigned</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { console.error("Chat list error:", err); }
        }

        let unsubscribeMessages = null;

        function openChat(assignmentId, title) {
            currentAssignmentId = assignmentId;
            document.getElementById('currentChatName').innerText = title;
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = firebase.firestore().collection('messages')
                .where('assignmentId', '==', assignmentId)
                .orderBy('createdAt', 'asc')
                .onSnapshot(snapshot => {
                    const messagesDiv = document.getElementById('chatMessages');
                    messagesDiv.innerHTML = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isSent = msg.senderId === currentUserId;
                        messagesDiv.innerHTML += `
                            <div class="message ${isSent ? 'message-sent' : 'message-received'}">
                                ${msg.text}
                            </div>
                        `;
                    });
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                });
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentAssignmentId || !currentUserId) return;

            input.value = '';
            
            try {
                await firebase.firestore().collection('messages').add({
                    assignmentId: currentAssignmentId,
                    senderId: currentUserId,
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                console.error("Failed to send message", err);
            }
        }

        function logout() {
            if(confirm("Are you sure you want to logout?")) {
                firebase.auth().signOut().then(() => window.location.href = 'index.html');
            }
        }
    </script>
</body>
</html>

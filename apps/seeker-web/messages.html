<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--ink-tint);
            color: var(--ink-purple);
        }
        .chat-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            background: white;
            height: 100%;
        }
        .chat-sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .chat-list-item {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-list-item:hover, .chat-list-item.active {
            background: var(--bg-secondary);
        }
        .chat-main {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #F8FAFC;
        }
        .chat-header {
            padding: 20px 32px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #EFEAE2;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
        }
        .message {
            max-width: 65%;
            padding: 8px 12px 24px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .message-sent {
            align-self: flex-end;
            background: #D9FDD3;
            color: #111B21;
            border-top-right-radius: 0;
        }
        .message-sent::before {
            content: '';
            position: absolute;
            top: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid #D9FDD3;
            border-bottom: 8px solid transparent;
        }
        .message-received {
            align-self: flex-start;
            background: white;
            color: #111B21;
            border-top-left-radius: 0;
        }
        .message-received::before {
            content: '';
            position: absolute;
            top: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-right: 8px solid white;
            border-bottom: 8px solid transparent;
        }
        .msg-time {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 11px;
            color: rgba(0,0,0,0.45);
        }
        .chat-input-area {
            padding: 24px 32px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
        }
        .chat-input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            outline: none;
        }
    </style>
</head>

                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely

                <a href="projects.html" class="menu-item">

                    My Projects

                <a href="messages.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="wallet.html" class="menu-item">

                    Pricing

            </nav>
            
            <div style="margin-top:auto">
                <a href="settings.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile Settings

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout

            </div>
        </aside>

        <main class="chat-container">
            <div class="chat-sidebar" id="chatSidebar">
                <div style="padding: 24px; border-bottom: 1px solid var(--border);">
                    <h3 style="font-weight: 700;">Chats</h3>
                </div>
                <div id="chatListContainer" style="overflow-y: auto;">
                    <div style="padding:20px; text-align:center; color:var(--text-tertiary);">Loading chats...</div>
                </div>
            </div>

            <div class="chat-main">
                <div class="chat-header" style="flex-wrap:wrap; gap:12px;">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div>
                            <div style="font-weight: 700;" id="currentChatName">Select a chat</div>
                        </div>
                    </div>
                    <div id="chatAttachments" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div style="text-align:center; color:var(--text-tertiary); margin-top: 40px;">Select an assignment from your projects to view messages.</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." disabled>
                    <button class="btn btn-primary" id="sendBtn" style="padding: 12px 24px;" onclick="sendMessage()" disabled>Send</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        let currentUserId = null;
        let currentAssignmentId = null;
        let unsubscribeMessages = null;
        const assignmentsCache = {};

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        document.addEventListener("DOMContentLoaded", () => {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    loadChatList(user.uid);
                    // Deep link: /messages.html#<assignmentId> auto-opens that chat
                    const hashId = (window.location.hash || '').replace('#', '').trim();
                    if (hashId) setTimeout(() => openChat(hashId, '…'), 400);
                } else {
                    window.location.href = 'index.html';
                }
            });

            document.getElementById('chatInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') sendMessage();
            });
        });

        // Load all assignments where the user is either the seeker OR the active writer.
        // Show in any state where chat is meaningful (BIDDING, ACTIVE, REVIEW, COMPLETED, DISPUTED).
        async function loadChatList(userId) {
            const container = document.getElementById('chatListContainer');
            try {
                const RELEVANT = ['BIDDING', 'ACTIVE', 'REVIEW', 'COMPLETED', 'DISPUTED'];
                const [seekerSnap, writerSnap] = await Promise.all([
                    firebase.firestore().collection('assignments')
                        .where('seekerId', '==', userId).get(),
                    firebase.firestore().collection('assignments')
                        .where('activeWriterId', '==', userId).get()
                ]);

                const seen = new Set();
                const items = [];
                [seekerSnap, writerSnap].forEach(snap => snap.forEach(doc => {
                    if (seen.has(doc.id)) return;
                    const a = doc.data();
                    if (!RELEVANT.includes(a.status)) return;
                    seen.add(doc.id);
                    a.id = doc.id;
                    assignmentsCache[doc.id] = a;
                    items.push({ ...a, isSeeker: a.seekerId === userId });
                }));

                // Newest first
                items.sort((x, y) => (y.createdAt?.toMillis?.() || 0) - (x.createdAt?.toMillis?.() || 0));

                if (items.length === 0) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-tertiary);">No active chats yet.</div>';
                    return;
                }

                container.innerHTML = items.map(a => {
                    const role = a.isSeeker ? 'Writer' : 'Seeker';
                    const initial = (a.title || 'W').charAt(0).toUpperCase();
                    return `
                        <div class="chat-list-item" data-id="${a.id}" data-title="${escapeHtml(a.title)}">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <div style="width:40px; height:40px; border-radius:50%; background:var(--ink-purple); color:white; display:flex; align-items:center; justify-content:center; font-weight:700;">${escapeHtml(initial)}</div>
                                <div style="flex:1; min-width:0;">
                                    <div style="font-weight: 600; font-size: 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(a.title || 'Untitled')}</div>
                                    <div style="font-size: 12px; color: var(--text-tertiary);">${role} · ${a.status}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Wire up clicks (avoid inline onclick + escaping issues)
                container.querySelectorAll('.chat-list-item').forEach(el => {
                    el.addEventListener('click', () => openChat(el.dataset.id, el.dataset.title));
                });
            } catch (err) {
                console.error("Chat list error:", err);
                container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-tertiary);">Could not load chats.</div>';
            }
        }

        function openChat(assignmentId, title) {
            currentAssignmentId = assignmentId;
            document.getElementById('currentChatName').innerText = title || 'Conversation';
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            const assignment = assignmentsCache[assignmentId];
            const attachmentsDiv = document.getElementById('chatAttachments');
            if (assignment && assignment.attachments && assignment.attachments.length > 0) {
                attachmentsDiv.innerHTML = assignment.attachments.map((att, idx) => `
                    <button type="button"
                            onclick="downloadChatAttachment(this, '${assignmentId}', ${idx})"
                            style="display:inline-flex; align-items:center; gap:6px; background:var(--ink-tint); color:var(--ink-purple); border:1px solid var(--ink-purple); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;"
                            title="Download ${att.filename || 'attachment'}">
                        📎 ${(att.filename || 'file').length > 24 ? (att.filename || 'file').slice(0, 22) + '…' : (att.filename || 'file')}
                    </button>
                `).join('');
            } else {
                attachmentsDiv.innerHTML = '';
            }

            // Highlight selected
            document.querySelectorAll('.chat-list-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === assignmentId);
            });

            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = Writely.subscribeToMessages(assignmentId, (messages) => {
                const div = document.getElementById('chatMessages');
                if (!messages.length) {
                    div.innerHTML = '<div style="text-align:center; color:var(--text-tertiary); margin-top: 40px;">No messages yet — say hello 👋</div>';
                    return;
                }
                div.innerHTML = messages.map(m => {
                    const isSent = m.senderId === currentUserId;
                    let timeStr = '';
                    if (m.createdAt && typeof m.createdAt.toDate === 'function') {
                        timeStr = m.createdAt.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    } else if (m.createdAt) {
                        timeStr = new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    }
                    return `
                        <div class="message ${isSent ? 'message-sent' : 'message-received'}">
                            ${escapeHtml(m.text)}
                            <div class="msg-time">${timeStr}</div>
                        </div>
                    `;
                }).join('');
                div.scrollTop = div.scrollHeight;
            });
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentAssignmentId) return;

            input.value = '';
            try {
                // Use backend so notification gets dispatched to the other party
                await Writely.sendMessage(currentAssignmentId, text);
            } catch (err) {
                console.error("Failed to send message", err);
                alert('Could not send message: ' + (err.message || err));
                input.value = text; // restore so user can retry
            }
        }

        async function downloadChatAttachment(btn, assignmentId, index) {
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Preparing…';
            try {
                await Writely.downloadAttachment(assignmentId, index);
            } catch (err) {
                alert('Could not download: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        function logout() { Writely.logout(); }
    </script>

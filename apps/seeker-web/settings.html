<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../../shared/utils/logic.js?v=2" defer></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--ink-tint);
            color: var(--ink-purple);
        }
        .main-content { padding: 40px; }
        .settings-card {
            background: white;
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 32px;
            max-width: 800px;
        }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-tertiary); margin-bottom: 8px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); outline: none; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo">
                <div class="logo-mark" style="background: var(--ink-purple)">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="projects.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    My Projects
                </a>
                <a href="messages.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="wallet.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                    Wallet
                </a>
                <a href="pricing.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Pricing
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="settings.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile Settings
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom:40px;">
                <h2 style="font-size: 28px; font-weight: 800;">Account Settings</h2>
                <p style="color: var(--text-secondary);">Manage your profile and security preferences.</p>
            </header>
            <div class="settings-card">
                <div style="display:flex; gap:24px; align-items:center; margin-bottom:32px; padding-bottom:32px; border-bottom:1px solid var(--border);">
                    <div id="profileAvatar" style="width:80px; height:80px; border-radius:50%; background:var(--ink-purple); color:white; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:800; background-size: cover; background-position: center;">AD</div>
                    <div>
                        <input type="file" id="photoInput" style="display:none" accept="image/*" onchange="handlePhotoUpload(this)">
                        <button class="btn btn-secondary" style="font-size:12px; padding:8px 16px;" onclick="document.getElementById('photoInput').click()">Change Photo</button>
                        <p style="font-size:12px; color:var(--text-tertiary); margin-top:8px;">JPG, GIF or PNG. Max size 2MB</p>
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" value="">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" value="" disabled>
                </div>
                <div class="form-group">
                    <label>University / Institution</label>
                    <input type="text" id="university" class="form-control" value="">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" class="form-control" value="">
                </div>
                <div class="form-group">
                    <label>Bio / About Me</label>
                    <textarea id="bio" class="form-control" rows="4"></textarea>
                </div>
                <button class="btn btn-primary" style="margin-top:16px;" onclick="saveSettings(this)">Save Changes</button>
            </div>
        </main>
    </div>

    <script>
        async function loadProfile() {
            try {
                const profile = await Writely.getUserProfile();
                if (profile) {
                    document.getElementById('fullName').value = profile.displayName || profile.fullName || '';
                    document.getElementById('email').value = profile.email || '';
                    document.getElementById('university').value = profile.collegeName || profile.university || '';
                    document.getElementById('phone').value = profile.phoneNumber || profile.phone || '';
                    document.getElementById('bio').value = profile.bio || '';
                    
                    // Update Avatar
                    const avatarDiv = document.getElementById('profileAvatar');
                    if (profile.avatarUrl) {
                        avatarDiv.style.backgroundImage = `url(${profile.avatarUrl})`;
                        avatarDiv.innerText = '';
                    } else {
                        const nameParts = (profile.displayName || profile.fullName || 'User').split(' ');
                        const initial = nameParts[0].charAt(0).toUpperCase() + (nameParts[1] ? nameParts[1].charAt(0).toUpperCase() : '');
                        avatarDiv.innerText = initial;
                        avatarDiv.style.backgroundImage = '';
                    }
                } else {
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error("Failed to load profile:", err);
            }
        }

        async function saveSettings(btn) {
            const data = {
                displayName: document.getElementById('fullName').value,
                fullName: document.getElementById('fullName').value, // Save both for compatibility
                collegeName: document.getElementById('university').value,
                phoneNumber: document.getElementById('phone').value,
                university: document.getElementById('university').value, // keeping for backwards compat
                phone: document.getElementById('phone').value, // keeping for backwards compat
                bio: document.getElementById('bio').value
            };

            const originalText = btn.innerText;
            btn.innerText = 'Saving...';
            btn.disabled = true;
            
            try {
                await Writely.updateUserProfile(data);
                btn.innerText = 'Saved Successfully!';
                btn.style.background = '#10B981';
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '';
                    btn.disabled = false;
                }, 2000);
            } catch (err) {
                console.error(err);
                alert("Failed to save profile. Please try again.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function handlePhotoUpload(input) {
            const file = input.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                alert("File size exceeds 2MB limit.");
                return;
            }

            const btn = document.querySelector('button[onclick*="photoInput"]');
            const originalText = btn.innerText;
            btn.innerText = 'Uploading...';
            btn.disabled = true;

            try {
                const photoUrl = await Writely.uploadProfilePhoto(file);
                
                // Update UI immediately
                const avatarDiv = document.getElementById('profileAvatar');
                avatarDiv.style.backgroundImage = `url(${photoUrl})`;
                avatarDiv.innerText = '';
                
                btn.innerText = 'Updated!';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 2000);
            } catch (err) {
                console.error(err);
                alert("Photo upload failed. Have you enabled Firebase Storage and set rules to public?");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }


        window.onload = () => {
            loadProfile();
        };
    </script>
    <!-- AI Support Chatbot -->
    <div id="aiSupport" onclick="toggleSupport()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </div>

    <div id="supportWindow" class="support-window">
        <div class="support-header">
            <div class="logo-mark" style="width:40px; height:40px; background:rgba(255,255,255,0.2);">
                <svg width="20" height="20" viewBox="0 0 42 42" fill="none">
                    <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                </svg>
            </div>
            <div class="bot-info">
                <h4>Writely Concierge</h4>
                <p>AI Assistant • Always Online</p>
            </div>
        </div>
        <div id="aiMessages" class="support-messages"></div>
        <div class="support-footer">
            <input type="text" id="supportInput" placeholder="Ask about payments, levels...">
            <button onclick="askAI()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../../shared/utils/logic.js" defer></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--ink-tint);
            color: var(--ink-purple);
        }
        .main-content {
            padding: 40px;
        }
        .wallet-card {
            background: linear-gradient(135deg, var(--ink-purple) 0%, #4F46E5 100%);
            padding: 40px;
            border-radius: 32px;
            color: white;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.2);
        }
        .transaction-table {
            width: 100%;
            background: white;
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            border-collapse: collapse;
        }
        .transaction-table th {
            text-align: left;
            padding: 16px 24px;
            background: var(--bg-secondary);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }
        .transaction-table td {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            font-size: 14px;
        }
        .amount-pos { color: #10B981; font-weight: 700; }
        .amount-neg { color: #EF4444; font-weight: 700; }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo">
                <div class="logo-mark" style="background: var(--ink-purple)">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="projects.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    My Projects
                </a>
                <a href="messages.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="wallet.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                    Wallet
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="settings.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile Settings
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom:40px;">
                <h2 style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em;">Wallet</h2>
                <p style="color: var(--text-secondary);">Manage your funds and transaction history.</p>
            </header>

            <div class="wallet-card">
                <div>
                    <div style="font-size: 14px; opacity: 0.8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Total Balance</div>
                    <div id="walletBalance" style="font-size: 48px; font-weight: 800;">₹0</div>
                </div>
                <div style="display:flex; gap:16px;">
                    <button class="btn" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600;" onclick="alert('Withdrawals directly from the wallet are coming soon! Currently, refunds are processed manually upon request.')">Withdraw</button>
                    <button id="addFundsBtn" class="btn" style="background: white; color: var(--ink-purple); border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600;" onclick="addFunds()">+ Add Funds</button>
                </div>
            </div>

            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 24px;">Recent Transactions</h3>
            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="transactionList">
                    <tr><td colspan="5" style="text-align:center;">Loading transactions...</td></tr>
                </tbody>
            </table>
        </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    loadWallet(user.uid);
                    loadTransactions(user.uid);
                } else {
                    window.location.href = 'index.html';
                }
            });
        });

        async function loadWallet(userId) {
            try {
                const doc = await firebase.firestore().collection('wallets').doc(userId).get();
                if (doc.exists) {
                    document.getElementById('walletBalance').innerText = `₹${(doc.data().balance || 0).toLocaleString()}`;
                } else {
                    document.getElementById('walletBalance').innerText = `₹0`;
                }
            } catch (err) { console.error("Wallet error:", err); }
        }

        async function loadTransactions(userId) {
            try {
                // Transactions where this user is the receiver (payouts, top-ups, withdrawals)
                const snapshot = await firebase.firestore().collection('transactions')
                    .where('receiverId', '==', userId)
                    .orderBy('timestamp', 'desc')
                    .limit(50)
                    .get();

                const list = document.getElementById('transactionList');
                if (snapshot.empty) {
                    list.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-tertiary);">No transactions found.</td></tr>';
                    return;
                }

                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const t = doc.data();
                    const dateStr = t.timestamp ? t.timestamp.toDate().toLocaleDateString() : 'Just now';
                    // Positive = money in (top-up, payout). Negative = money out (withdrawal).
                    const isPos = t.amount > 0;
                    const colorClass = isPos ? 'amount-pos' : 'amount-neg';
                    const sign = isPos ? '+' : '-';
                    const niceType = ({
                        WALLET_TOPUP: 'Top-Up',
                        PAYOUT: 'Job Payout',
                        WITHDRAWAL: 'Withdrawal'
                    })[t.type] || t.type;

                    list.innerHTML += `
                        <tr>
                            <td>
                                <div style="font-weight: 600;">${niceType}</div>
                                <div style="font-size: 12px; color: var(--text-tertiary);">${doc.id}</div>
                            </td>
                            <td>${niceType}</td>
                            <td>${dateStr}</td>
                            <td><span class="${colorClass}">${sign}₹${Math.abs(t.amount).toLocaleString()}</span></td>
                            <td><span style="font-weight: 600;">${t.status || 'Completed'}</span></td>
                        </tr>
                    `;
                });
            } catch (err) { console.error("Transactions error:", err); }
        }

        async function addFunds() {
            const raw = prompt('How much would you like to add to your wallet?\n\nMin ₹100, Max ₹50,000', '500');
            if (raw === null) return; // cancelled
            const amount = Number(raw);
            if (!Number.isFinite(amount) || amount < 100 || amount > 50000) {
                alert('Please enter a valid amount between ₹100 and ₹50,000.');
                return;
            }
            
            const btn = document.getElementById('addFundsBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Processing...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const added = await Writely.topUpWallet(amount);
                alert(`✅ ₹${added.toLocaleString()} added to your wallet!`);
                const user = firebase.auth().currentUser;
                if (user) {
                    loadWallet(user.uid);
                    loadTransactions(user.uid);
                }
            } catch (err) {
                console.error('Top-up failed:', err);
                alert('Payment failed: ' + (err.message || 'Unknown error'));
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        function logout() {
            if(confirm("Are you sure you want to logout?")) {
                firebase.auth().signOut().then(() => window.location.href = 'index.html');
            }
        }
    </script>
    <!-- AI Support Chatbot -->
    <div id="aiSupport" onclick="toggleSupport()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </div>

    <div id="supportWindow" class="support-window">
        <div class="support-header">
            <div class="logo-mark" style="width:40px; height:40px; background:rgba(255,255,255,0.2);">
                <svg width="20" height="20" viewBox="0 0 42 42" fill="none">
                    <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                </svg>
            </div>
            <div class="bot-info">
                <h4>Writely Concierge</h4>
                <p>AI Assistant • Always Online</p>
            </div>
        </div>
        <div id="aiMessages" class="support-messages"></div>
        <div class="support-footer">
            <input type="text" id="supportInput" placeholder="Ask about payments, levels...">
            <button onclick="askAI()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</body>
</html>

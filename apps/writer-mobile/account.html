<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../../shared/utils/logic.js" defer></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .sidebar { background: white; border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column; gap: 40px; position: sticky; top: 0; height: 100vh; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 500; }
        .menu-item:hover, .menu-item.active { background: var(--ink-tint); color: var(--ink-purple); }
        .main-content { padding: 40px; }

        .settings-grid { display: grid; grid-template-columns: 300px 1fr; gap: 48px; }
        .profile-upload {
            width: 120px;
            height: 120px;
            border-radius: 40px;
            background: var(--ink-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            cursor: pointer;
            border: 2px dashed var(--ink-purple);
        }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 8px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="writer.html" class="logo">
                <div class="logo-mark" style="background: var(--flow-teal)">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="writer.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                </a>
                <a href="browse-jobs.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Browse Jobs
                </a>
                <a href="submissions.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    My Submissions
                </a>
                <a href="messages.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="earnings.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Earnings
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="account.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Account
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom:48px;">
                <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">Account Settings</h1>
                <p style="color: var(--text-secondary);">Update your profile and professional details.</p>
            </header>

            <div class="settings-grid">
                <div>
                    <div id="profileAvatar" class="profile-upload" onclick="document.getElementById('photoInput').click()" style="background-size: cover; background-position: center;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--ink-purple)" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </div>
                    <input type="file" id="photoInput" style="display:none" accept="image/*" onchange="handlePhotoUpload(this)">
                    <h4 id="writerNameHeader" style="font-weight: 700; margin-bottom: 4px;">Loading...</h4>
                    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">Elite Expert Writer</p>
                    <button class="btn btn-secondary" style="width: 100%;" onclick="openPasswordModal()">Change Password</button>
                </div>

                <form onsubmit="saveSettings(event)" style="background: white; padding: 40px; border-radius: 24px; border: 1px solid var(--border);">
                    <div class="form-group">
                        <label>Display Name</label>
                        <input type="text" id="writerDisplayName" value="">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="writerEmail" value="" disabled>
                    </div>
                    <div class="form-group">
                        <label>College / University</label>
                        <input type="text" id="writerCollege" value="" placeholder="e.g. Delhi University">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="writerPhone" value="" placeholder="e.g. +91 9876543210">
                    </div>
                    <div class="form-group">
                        <label>Professional Bio</label>
                        <textarea id="writerBio" rows="4" placeholder="Briefly describe your writing experience..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Specialized Skills (Comma separated)</label>
                        <input type="text" id="writerSkills" placeholder="e.g. Finance, Economics, Academic Research, Case Study">
                        <div id="skillsContainer" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;"></div>
                    </div>
                    <div style="display:flex; justify-content:flex-end;">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="passwordModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:40px; border-radius:32px; width:100%; max-width:400px; box-shadow:0 32px 64px rgba(0,0,0,0.2);">
            <h2 style="font-weight:800; margin-bottom:8px;">Change Password</h2>
            <p style="color:var(--text-secondary); font-size:14px; margin-bottom:32px;">Enter your new password below.</p>
            
            <form onsubmit="handlePasswordChange(event)">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div style="display:flex; gap:12px; margin-top:32px;">
                    <button type="button" onclick="closePasswordModal()" class="btn btn-secondary" style="flex:1;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:2;">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const profile = await Writely.getUserProfile();
                if (profile) {
                    document.getElementById('writerNameHeader').innerText = profile.displayName || profile.fullName || 'Writer';
                    document.getElementById('writerDisplayName').value = profile.displayName || profile.fullName || '';
                    document.getElementById('writerEmail').value = profile.email || '';
                    document.getElementById('writerCollege').value = profile.collegeName || profile.university || '';
                    document.getElementById('writerPhone').value = profile.phoneNumber || profile.phone || '';
                    document.getElementById('writerBio').value = profile.bio || '';
                    document.getElementById('writerSkills').value = (profile.skills || []).join(', ');
                    
                    if (profile.avatarUrl) {
                        document.getElementById('profileAvatar').style.backgroundImage = `url(${profile.avatarUrl})`;
                        document.getElementById('profileAvatar').innerHTML = '';
                    }
                    renderSkills(profile.skills || []);
                } else {
                    window.location.href = '../seeker-web/login.html';
                }
            } catch (err) { console.error(err); }
        }

        function renderSkills(skills) {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = skills.map(s => `<span class="pill" style="background:var(--bg-secondary); color:var(--ink-purple); font-weight:600; padding:6px 12px; border-radius:10px; font-size:12px;">${s}</span>`).join('');
        }

        document.getElementById('writerSkills').addEventListener('input', (e) => {
            const skills = e.target.value.split(',').map(s => s.trim()).filter(s => s);
            renderSkills(skills);
        });

        async function saveSettings(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            const skills = document.getElementById('writerSkills').value.split(',').map(s => s.trim()).filter(s => s);
            const data = {
                displayName: document.getElementById('writerDisplayName').value,
                fullName: document.getElementById('writerDisplayName').value,
                collegeName: document.getElementById('writerCollege').value,
                phoneNumber: document.getElementById('writerPhone').value,
                bio: document.getElementById('writerBio').value,
                skills: skills
            };

            try {
                btn.innerText = 'Saving...';
                await Writely.updateUserProfile(data);
                btn.innerText = 'Saved!';
                setTimeout(() => btn.innerText = originalText, 2000);
                loadProfile();
            } catch (err) {
                alert("Failed to save: " + err.message);
                btn.innerText = originalText;
            }
        }

        async function handlePhotoUpload(input) {
            const file = input.files[0];
            if (!file) return;
            try {
                const url = await Writely.uploadProfilePhoto(file);
                document.getElementById('profileAvatar').style.backgroundImage = `url(${url})`;
                document.getElementById('profileAvatar').innerHTML = '';
            } catch (err) { alert("Upload failed"); }
        }

        function openPasswordModal() { document.getElementById('passwordModal').style.display = 'flex'; }
        function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; }

        async function handlePasswordChange(event) {
            event.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) { alert("Passwords do not match"); return; }

            try {
                await firebase.auth().currentUser.updatePassword(newPass);
                alert("Password updated successfully!");
                closePasswordModal();
            } catch (err) {
                if (err.code === 'auth/requires-recent-login') {
                    alert("Please logout and login again to change password for security.");
                } else {
                    alert("Error: " + err.message);
                }
            }
        }

        window.onload = loadProfile;
    </script>
    <!-- AI Support Chatbot -->
    <div id="aiSupport" onclick="toggleSupport()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </div>

    <div id="supportWindow" class="support-window">
        <div class="support-header">
            <div class="logo-mark" style="width:40px; height:40px; background:rgba(255,255,255,0.2);">
                <svg width="20" height="20" viewBox="0 0 42 42" fill="none">
                    <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                </svg>
            </div>
            <div class="bot-info">
                <h4>Writely Concierge</h4>
                <p>AI Assistant • Always Online</p>
            </div>
        </div>
        <div id="aiMessages" class="support-messages"></div>
        <div class="support-footer">
            <input type="text" id="supportInput" placeholder="Ask about payments, levels...">
            <button onclick="askAI()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</body>
</html>

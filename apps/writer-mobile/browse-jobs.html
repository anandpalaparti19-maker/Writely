<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="../../shared/utils/logic.js" defer></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--ink-tint);
            color: var(--ink-purple);
        }
        .main-content {
            padding: 40px;
        }
        
        .job-card {
            background: white;
            padding: 32px;
            border-radius: 24px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .job-card:hover {
            border-color: var(--ink-purple);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }
        .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .job-title { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .job-meta { display: flex; gap: 16px; color: var(--text-secondary); font-size: 13px; font-weight: 500; }
        .job-price { 
            background: var(--ink-tint); 
            color: var(--ink-purple); 
            padding: 12px 20px; 
            border-radius: 16px; 
            font-weight: 800; 
            font-size: 20px;
        }
        
        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .filter-pill {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-pill.active {
            background: var(--ink-purple);
            color: white;
            border-color: var(--ink-purple);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="writer.html" class="logo">
                <div class="logo-mark">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="writer.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                </a>
                <a href="browse-jobs.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Browse Jobs
                </a>
                <a href="submissions.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    My Submissions
                </a>
                <a href="earnings.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Earnings
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="account.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Account
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom:40px;">
                <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">Explore Opportunities</h1>
                <p style="color: var(--text-secondary);">Find the perfect assignment that matches your expertise.</p>
            </header>

            <!-- Location-based scope tabs (Rapido-style) -->
            <div class="filters-bar" style="margin-bottom:16px;">
                <div class="filter-pill active" data-scope="nearby">📍 Nearby</div>
                <div class="filter-pill" data-scope="city">🏙️ My City</div>
                <div class="filter-pill" data-scope="all">🌐 All India</div>
            </div>
            <p id="locationHint" style="font-size:12px; color:var(--text-tertiary); margin: -8px 0 24px;"></p>

            <div id="jobList">
                <!-- Shimmer/Loading State -->
                <div class="job-card" style="opacity: 0.5;">
                    <div style="height: 24px; background: #eee; width: 60%; margin-bottom: 12px; border-radius: 4px;"></div>
                    <div style="height: 16px; background: #eee; width: 40%; border-radius: 4px;"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- BID MODAL -->
    <div id="bidModal" class="modal">
        <div class="modal-content">
            <h2 style="font-weight: 800; margin-bottom: 8px;">Send Proposal</h2>
            <p id="modalJobTitle" style="color: var(--ink-purple); font-weight: 700; margin-bottom: 32px;">Job Title</p>
            
            <form id="bidForm">
                <input type="hidden" id="jobId">
                <div style="margin-bottom: 24px;">
                    <label style="display:block; font-size:12px; font-weight:700; color:var(--text-tertiary); margin-bottom:8px; text-transform:uppercase;">Your Bid Amount (₹)</label>
                    <input type="number" id="bidAmount" style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); font-size:18px; font-weight:700;" placeholder="0.00" required>
                </div>
                <div style="margin-bottom: 32px;">
                    <label style="display:block; font-size:12px; font-weight:700; color:var(--text-tertiary); margin-bottom:8px; text-transform:uppercase;">Cover Letter / Pitch</label>
                    <textarea id="bidProposal" style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); min-height:120px;" placeholder="Explain why you are the best fit for this project..." required></textarea>
                </div>
                <div style="display:flex; gap:16px;">
                    <button type="button" onclick="closeBidModal()" class="btn btn-secondary" style="flex:1;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:2;">Submit Proposal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Writer's location (loaded from their Firestore profile on auth)
        let writerLocation = { pincode: '', city: '' };
        let currentScope = 'all'; // default to 'all' until we know the writer's location

        // Pretty label for the proximity badge on each job card
        function proximityBadge(prox, jobCity) {
            if (prox === 'same_pincode') return '<span class="filter-pill" style="font-size:11px; padding:4px 12px; background:#DCFCE7; color:#15803D; border-color:#86EFAC;">📍 Same Area</span>';
            if (prox === 'same_city')    return `<span class="filter-pill" style="font-size:11px; padding:4px 12px; background:#DBEAFE; color:#1D4ED8; border-color:#93C5FD;">🏙️ ${jobCity || 'Same City'}</span>`;
            return jobCity ? `<span class="filter-pill" style="font-size:11px; padding:4px 12px;">${jobCity}</span>` : '';
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function loadWriterLocation() {
            try {
                const profile = await Writely.getUserProfile();
                if (profile) {
                    writerLocation.pincode = profile.pincode || '';
                    writerLocation.city = profile.cityNormalized || (profile.city || '').toLowerCase();
                }
            } catch (_) { /* fall through — All India scope still works */ }

            // Update the header hint based on what we know
            const hint = document.getElementById('locationHint');
            if (!writerLocation.pincode && !writerLocation.city) {
                hint.innerHTML = '⚠️ Set your city and pincode in <a href="account.html" style="color:var(--ink-purple);">Account</a> to see nearby jobs.';
                currentScope = 'all';
                document.querySelectorAll('.filter-pill[data-scope]').forEach(el => {
                    el.classList.toggle('active', el.dataset.scope === 'all');
                });
            } else {
                hint.textContent = `Showing jobs in pincode ${writerLocation.pincode || '—'} (${writerLocation.city || ''})`;
            }
        }

        async function fetchJobs() {
            const container = document.getElementById('jobList');
            container.innerHTML = `<div class="job-card" style="opacity: 0.5;">
                <div style="height: 24px; background: #eee; width: 60%; margin-bottom: 12px; border-radius: 4px;"></div>
                <div style="height: 16px; background: #eee; width: 40%; border-radius: 4px;"></div>
            </div>`;

            try {
                const page = await Writely.getJobFeedPage({
                    scope: currentScope,
                    pincode: writerLocation.pincode,
                    city: writerLocation.city
                });
                const jobs = page.jobs || [];
                container.innerHTML = '';

                if (jobs.length === 0) {
                    const cta = currentScope === 'nearby'
                        ? `No jobs in your area yet.<br><button onclick="setScope('city')" class="btn btn-secondary" style="margin-top:16px;">Try My City</button>`
                        : currentScope === 'city'
                        ? `No jobs in your city yet.<br><button onclick="setScope('all')" class="btn btn-secondary" style="margin-top:16px;">Try All India</button>`
                        : 'No new jobs available at the moment.';
                    container.innerHTML = `<div style="text-align:center; padding:80px; color:var(--text-tertiary);">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        <p>${cta}</p>
                    </div>`;
                    return;
                }

                jobs.forEach(job => {
                    const card = document.createElement('div');
                    card.className = 'job-card';
                    const cityDisplay = job.cityDisplay || (job.city ? job.city.charAt(0).toUpperCase() + job.city.slice(1) : '');

                    // Deadline rendering — Firestore Timestamps come over the wire as { _seconds, _nanoseconds }
                    let deadlineLabel = '';
                    let deadlineColor = 'var(--text-secondary)';
                    if (job.deadline) {
                        const ms = job.deadline._seconds ? job.deadline._seconds * 1000 : new Date(job.deadline).getTime();
                        if (Number.isFinite(ms)) {
                            const hoursLeft = (ms - Date.now()) / 36e5;
                            const dt = new Date(ms);
                            const dStr = dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
                            const tStr = dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                            deadlineLabel = `⏱ ${dStr}, ${tStr}`;
                            if (hoursLeft < 0) { deadlineLabel = '⏱ Overdue'; deadlineColor = '#EF4444'; }
                            else if (hoursLeft < 24) deadlineColor = '#EF4444';
                            else if (hoursLeft < 72) deadlineColor = '#D97706';
                        }
                    }

                    card.innerHTML = `
                        <div class="job-header">
                            <div>
                                <h3 class="job-title">${escapeHtml(job.title)}</h3>
                                <div class="job-meta">
                                    <span>${job.deliveryMethod || 'Digital'}</span>
                                    <span>•</span>
                                    <span>${escapeHtml(cityDisplay || 'City —')}, ${escapeHtml(job.pincode || '—')}</span>
                                </div>
                            </div>
                            <div class="job-price">₹${job.budget}</div>
                        </div>
                        ${(job.collegeName || deadlineLabel) ? `
                            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
                                ${job.collegeName ? `<span style="background:#EEF2FF; color:#4338CA; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600;">🎓 ${escapeHtml(job.collegeName)}</span>` : ''}
                                ${deadlineLabel ? `<span style="background:#F1F5F9; color:${deadlineColor}; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600;">${deadlineLabel}</span>` : ''}
                            </div>` : ''}
                        <p style="color:var(--text-secondary); font-size:15px; margin-bottom:24px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
                            ${escapeHtml(job.description || 'No description provided.')}
                        </p>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; gap:8px;">
                                ${proximityBadge(job.proximity, cityDisplay)}
                            </div>
                            <button class="btn btn-primary" style="padding:10px 24px; font-size:14px;" onclick="openBidModal('${job.id}', ${JSON.stringify(job.title).replace(/"/g, '&quot;')}, ${job.budget})">Send Proposal</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="text-align:center; padding:40px; color:var(--text-tertiary);">Failed to load jobs. Please try again.</p>';
            }
        }

        function setScope(scope) {
            currentScope = scope;
            document.querySelectorAll('.filter-pill[data-scope]').forEach(el => {
                el.classList.toggle('active', el.dataset.scope === scope);
            });
            fetchJobs();
        }

        // Wire up scope tabs
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.filter-pill[data-scope]').forEach(el => {
                el.addEventListener('click', () => setScope(el.dataset.scope));
            });
        });

        function openBidModal(id, title, budget) {
            document.getElementById('jobId').value = id;
            document.getElementById('modalJobTitle').innerText = title;
            document.getElementById('bidAmount').value = budget;
            document.getElementById('bidModal').style.display = 'flex';
        }

        function closeBidModal() {
            document.getElementById('bidModal').style.display = 'none';
        }

        document.getElementById('bidForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-primary');
            btn.innerText = 'Submitting...';
            btn.disabled = true;

            const currentUser = firebase.auth().currentUser;
            const bidData = {
                amount: Number(document.getElementById('bidAmount').value),
                proposal: document.getElementById('bidProposal').value
            };
            if (!currentUser) { alert('Not logged in. Please refresh.'); return; }

            try {
                const jobId = document.getElementById('jobId').value;
                const response = await Writely.apiFetch(`/assignments/${jobId}/bid`, {
                    method: 'POST',
                    body: JSON.stringify(bidData)
                });

                if (response.ok) {
                    alert('Proposal sent successfully!');
                    closeBidModal();
                    fetchJobs();
                }
            } catch (err) {
                alert('Submission failed.');
            } finally {
                btn.innerText = 'Submit Proposal';
                btn.disabled = false;
            }
        };

        // Wait for auth, then load writer's location, then fetch jobs in their scope
        firebase.auth().onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = '../seeker-web/login.html';
                return;
            }
            await loadWriterLocation();
            fetchJobs();
        });
    </script>
</body>
</html>

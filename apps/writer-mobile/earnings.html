<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../../shared/utils/logic.js" defer></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .sidebar { background: white; border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column; gap: 40px; position: sticky; top: 0; height: 100vh; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 500; }
        .menu-item:hover, .menu-item.active { background: var(--ink-tint); color: var(--ink-purple); }
        .main-content { padding: 40px; }

        .earnings-card {
            background: linear-gradient(135deg, var(--flow-teal) 0%, #10B981 100%);
            padding: 40px;
            border-radius: 32px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }
        .transaction-list { background: white; border-radius: 24px; border: 1px solid var(--border); overflow: hidden; }
        .transaction-item { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .transaction-item:last-child { border-bottom: none; }
        .amount-plus { color: #10B981; font-weight: 700; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="writer.html" class="logo">
                <div class="logo-mark" style="background: var(--flow-teal)">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="writer.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                </a>
                <a href="browse-jobs.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Browse Jobs
                </a>
                <a href="submissions.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    My Submissions
                </a>
                <a href="messages.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="earnings.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Earnings
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="account.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Account
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom:40px;">
                <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">Earnings</h1>
                <p style="color: var(--text-secondary);">Manage your payouts and view your financial history.</p>
            </header>

            <div class="earnings-card">
                <div>
                    <div style="font-size: 14px; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 8px;">Available for Payout</div>
                    <div id="walletBalance" style="font-size: 48px; font-weight: 800;">₹0.00</div>
                </div>
                <button class="btn" id="withdrawBtn" onclick="withdrawFunds()" style="background: white; color: var(--flow-teal); border: none; padding: 16px 32px; border-radius: 16px; font-weight: 700;">Withdraw Funds</button>
            </div>

            <h3 style="font-weight: 700; margin-bottom: 24px;">Transaction History</h3>
            <div class="transaction-list" id="transactionList">
                <div style="padding: 24px; text-align: center; color: var(--text-secondary);">Loading transactions...</div>
            </div>
        </main>
    </div>

    <script>
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            loadEarnings(user);
        });

        async function loadEarnings(user) {
            try {
                // Fetch Wallet Balance
                const walletDoc = await firebase.firestore().collection('wallets').doc(user.uid).get();
                if (walletDoc.exists) {
                    document.getElementById('walletBalance').innerText = '₹' + walletDoc.data().balance.toLocaleString();
                }

                // Fetch Transactions
                const txSnap = await firebase.firestore().collection('transactions')
                    .where('receiverId', '==', user.uid)
                    .get();
                
                const list = document.getElementById('transactionList');
                let transactions = [];
                txSnap.forEach(doc => transactions.push({ id: doc.id, ...doc.data() }));

                // Sort locally
                transactions.sort((a, b) => {
                    const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                    const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                    return timeB - timeA;
                });

                if (transactions.length === 0) {
                    list.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No transactions yet.</div>';
                    return;
                }

                list.innerHTML = '';
                transactions.forEach(tx => {
                    const item = document.createElement('div');
                    item.className = 'transaction-item';
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: 700;">Payout for Assignment</div>
                            <div style="font-size: 12px; color: var(--text-tertiary);">Reference: #${tx.id.substring(0, 8)}</div>
                        </div>
                        <div class="amount-plus">+₹${tx.amount.toLocaleString()}</div>
                    `;
                    list.appendChild(item);
                });

            } catch (err) {
                console.error("Earnings Error:", err);
                document.getElementById('transactionList').innerHTML = '<div style="padding: 24px; text-align: center; color: #EF4444;">Failed to load earnings data.</div>';
            }
        }

        async function withdrawFunds() {
            const user = firebase.auth().currentUser;
            if (!user) return;

            if(!confirm("Are you sure you want to withdraw your entire balance?")) return;

            const btn = document.getElementById('withdrawBtn');
            btn.innerText = 'Processing...';
            btn.disabled = true;

            try {
                const response = await Writely.apiFetch(`/wallets/${user.uid}/withdraw`, {
                    method: 'POST'
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Withdrawal failed");

                alert('Withdrawal processed successfully! Funds will reflect in your bank shortly.');
                loadEarnings(user); // Reload UI

            } catch (err) {
                alert(err.message || 'Withdrawal failed. Try again.');
                console.error(err);
            } finally {
                btn.innerText = 'Withdraw Funds';
                btn.disabled = false;
            }
        }
    </script>
    <!-- AI Support Chatbot -->
    <div id="aiSupport" onclick="toggleSupport()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </div>

    <div id="supportWindow" class="support-window">
        <div class="support-header">
            <div class="logo-mark" style="width:40px; height:40px; background:rgba(255,255,255,0.2);">
                <svg width="20" height="20" viewBox="0 0 42 42" fill="none">
                    <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                </svg>
            </div>
            <div class="bot-info">
                <h4>Writely Concierge</h4>
                <p>AI Assistant • Always Online</p>
            </div>
        </div>
        <div id="aiMessages" class="support-messages"></div>
        <div class="support-footer">
            <input type="text" id="supportInput" placeholder="Ask about payments, levels...">
            <button onclick="askAI()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Submissions | Writely</title>
    <link rel="stylesheet" href="../../shared/utils/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="../../shared/utils/logic.js" defer></script>
    <style>
        body { background-color: var(--bg-secondary); }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--ink-tint);
            color: var(--ink-purple);
        }
        .main-content { padding: 40px; }

        .submission-card {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 24px;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-bidding { background: #E0F2FE; color: #0369A1; }
        .status-active { background: #DCFCE7; color: #166534; }
        .status-review { background: #FEF9C3; color: #854D0E; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="writer.html" class="logo">
                <div class="logo-mark" style="background: var(--flow-teal)">
                    <svg width="18" height="18" viewBox="0 0 42 42" fill="none">
                        <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M21 14 Q24 22 22 30" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                    </svg>
                </div>
                Writely
            </a>
            
            <nav class="sidebar-menu">
                <a href="writer.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                </a>
                <a href="browse-jobs.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Browse Jobs
                </a>
                <a href="submissions.html" class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    My Submissions
                </a>
                <a href="messages.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="earnings.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Earnings
                </a>
            </nav>
            
            <div style="margin-top:auto">
                <a href="account.html" class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Account
                </a>
                <a href="#" onclick="logout()" class="menu-item" style="color: #EF4444; margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <!-- SUBMIT SOLUTION MODAL -->
            <div id="submitModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); z-index:1000; align-items:center; justify-content:center;">
                <div style="background:white; padding:40px; border-radius:32px; width:100%; max-width:500px; box-shadow:0 32px 64px rgba(0,0,0,0.2);">
                    <h2 style="font-weight:800; margin-bottom:8px;">Deliver Work</h2>
                    <p style="color:var(--text-secondary); font-size:14px; margin-bottom:32px;">Upload your final document for seeker review.</p>
                    
                    <form id="submitForm" onsubmit="handleDelivery(event)">
                        <input type="hidden" name="assignmentId" id="submitAssignmentId">
                        <input type="hidden" name="deliveryMethod" id="submitDeliveryMethod">
                        
                        <div style="margin-bottom:20px;">
                            <label style="display:block; font-size:12px; font-weight:700; color:var(--text-tertiary); margin-bottom:8px; text-transform:uppercase;">Delivery Notes</label>
                            <textarea name="notes" placeholder="Any final comments for the seeker..." style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);" required></textarea>
                        </div>
                        
                        <div id="digitalUploadSection" style="margin-bottom:20px;">
                            <label style="display:block; font-size:12px; font-weight:700; color:var(--text-tertiary); margin-bottom:8px; text-transform:uppercase;">Final Document</label>
                            <input type="file" id="solutionInput" name="solution" style="width:100%; font-size:12px;">
                        </div>

                        <div id="physicalTrackingSection" style="margin-bottom:20px; display:none;">
                            <label style="display:block; font-size:12px; font-weight:700; color:var(--text-tertiary); margin-bottom:8px; text-transform:uppercase;">Courier Tracking Link / Details</label>
                            <input type="text" id="trackingInput" name="tracking" placeholder="e.g. DTDC Tracking ID 123456" style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);">
                        </div>

                        <div style="display:flex; gap:12px; margin-top:32px;">
                            <button type="button" onclick="closeSubmitModal()" class="btn btn-secondary" style="flex:1;">Cancel</button>
                            <button type="submit" id="deliverBtn" class="btn btn-primary" style="flex:2;">Deliver Now</button>
                        </div>
                    </form>
                </div>
            </div>
            <header style="margin-bottom:40px;">
                <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">My Submissions</h1>
                <p style="color: var(--text-secondary);">Track your active proposals and delivered work.</p>
            </header>

            <div id="submissionList">
                <div style="text-align:center; padding:40px; color:var(--text-secondary);">Loading your submissions...</div>
            </div>
        </main>
    </div>

    <script>
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            loadSubmissions(user);
        });

        async function loadSubmissions(user) {
            const container = document.getElementById('submissionList');
            try {
                // Fetch all assignments to filter bids and active projects locally
                const snapshot = await firebase.firestore().collection('assignments').orderBy('createdAt', 'desc').get();
                const allAssignments = [];
                snapshot.forEach(doc => allAssignments.push({ id: doc.id, ...doc.data() }));

                // Filter where user is the active writer OR user has placed a bid
                const mySubmissions = allAssignments.filter(job => {
                    const isMyProject = job.activeWriterId === user.uid;
                    const hasMyBid = job.bids && job.bids.some(bid => bid.writerId === user.uid);
                    return isMyProject || hasMyBid;
                });

                if (mySubmissions.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary);">You haven't submitted any proposals yet. Check the Browse Jobs tab!</div>`;
                    return;
                }

                container.innerHTML = '';
                mySubmissions.forEach(job => {
                    const isAssignedToMe = job.activeWriterId === user.uid;
                    let displayStatus = 'Proposal Sent';
                    let badgeClass = 'status-bidding';
                    
                    if (isAssignedToMe) {
                        if (job.status === 'ACTIVE') {
                            displayStatus = 'Active Work';
                            badgeClass = 'status-active';
                        } else if (job.status === 'COMPLETED') {
                            displayStatus = 'Completed';
                            badgeClass = 'status-active';
                        }
                    }

                    // Build attachment download buttons (only visible to the assigned writer)
                    const attachments = Array.isArray(job.attachments) ? job.attachments : [];
                    let attachmentsHtml = '';
                    if (isAssignedToMe && attachments.length > 0) {
                        const items = attachments.map((att, idx) => `
                            <button type="button"
                                    class="download-attachment"
                                    data-assignment="${job.id}" data-index="${idx}"
                                    style="display:inline-flex; align-items:center; gap:6px; background:var(--ink-tint); color:var(--ink-purple); border:1px solid var(--ink-purple); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; margin:2px;"
                                    title="Download ${att.filename || 'attachment'}">
                                📎 ${(att.filename || 'file').length > 24 ? (att.filename || 'file').slice(0, 22) + '…' : (att.filename || 'file')}
                            </button>
                        `).join('');
                        attachmentsHtml = `
                            <div style="grid-column: 1 / -1; padding-top:12px; border-top:1px dashed var(--border);">
                                <div style="font-size:11px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; margin-bottom:6px;">Assignment Files (${attachments.length})</div>
                                ${items}
                            </div>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'submission-card';
                    card.innerHTML = `
                        <div>
                            <h3 style="font-weight: 700; margin-bottom: 4px;">${job.title}</h3>
                            <p style="font-size: 13px; color: var(--text-secondary);">Budget: ₹${job.budget.toLocaleString()}</p>
                        </div>
                        <div class="status-badge ${badgeClass}">${displayStatus}</div>
                        <div style="display:flex; gap:8px;">
                            ${isAssignedToMe && job.status !== 'COMPLETED' ? `<a href="messages.html#${job.id}" class="btn btn-secondary" style="padding:8px 16px; font-size:13px;">Chat</a>` : ''}
                            <button class="btn ${isAssignedToMe ? 'btn-primary' : 'btn-secondary'}" 
                                    style="padding:8px 16px; font-size:13px;" 
                                    ${job.status === 'COMPLETED' ? 'disabled' : ''}
                                    onclick="${isAssignedToMe ? `openSubmitModal('${job.id}', '${job.deliveryMethod}')` : `alert('Bid summary: ₹${job.bids?.find(b => b.writerId === user.uid)?.amount || '0'} - Pending seeker review.')`}">
                                ${job.status === 'COMPLETED' ? 'Paid' : (isAssignedToMe ? 'Deliver Work' : 'View Bid')}
                            </button>
                        </div>
                        ${attachmentsHtml}
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div style="text-align:center; padding:40px; color:#EF4444;">Failed to load submissions.</div>`;
            }
        }

        // Delegated click handler — works for all .download-attachment buttons
        // regardless of when they're added to the DOM.
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('.download-attachment');
            if (!btn) return;
            e.preventDefault();
            const { assignment, index } = btn.dataset;
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Preparing…';
            try {
                await Writely.downloadAttachment(assignment, Number(index));
            } catch (err) {
                alert('Could not download: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });
        
        function openSubmitModal(id, deliveryMethod) {
            document.getElementById('submitAssignmentId').value = id;
            document.getElementById('submitDeliveryMethod').value = deliveryMethod;
            
            const digitalSection = document.getElementById('digitalUploadSection');
            const physicalSection = document.getElementById('physicalTrackingSection');
            const solutionInput = document.getElementById('solutionInput');
            const trackingInput = document.getElementById('trackingInput');

            if (deliveryMethod === 'Physical') {
                digitalSection.style.display = 'none';
                solutionInput.required = false;
                physicalSection.style.display = 'block';
                trackingInput.required = true;
            } else {
                digitalSection.style.display = 'block';
                solutionInput.required = true;
                physicalSection.style.display = 'none';
                trackingInput.required = false;
            }

            document.getElementById('submitModal').style.display = 'flex';
        }
        function closeSubmitModal() { document.getElementById('submitModal').style.display = 'none'; }
        
        async function handleDelivery(event) {
            event.preventDefault();
            const form = event.target;
            const id = document.getElementById('submitAssignmentId').value;
            const method = document.getElementById('submitDeliveryMethod').value;
            const formData = new FormData(form);

            const btn = document.getElementById('deliverBtn');
            btn.innerText = 'Delivering...';
            btn.disabled = true;

            try {
                const response = await Writely.apiFetch(`/assignments/${id}/submit`, {
                    method: 'POST',
                    body: formData
                });
                
                if(response.ok) {
                    alert(method === 'Physical' ? 'Dispatched! Tracking info sent to seeker.' : 'Work Delivered! Pending Seeker Review.');
                    location.reload();
                } else {
                    const err = await response.json();
                    throw new Error(err.error || 'Delivery failed');
                }
            } catch (err) {
                console.error(err);
                alert(err.message);
            } finally {
                btn.innerText = 'Deliver Now';
                btn.disabled = false;
            }
        }
    </script>

    <!-- AI Support Chatbot -->
    <div id="aiSupport" onclick="toggleSupport()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </div>

    <div id="supportWindow" class="support-window">
        <div class="support-header">
            <div class="logo-mark" style="width:40px; height:40px; background:rgba(255,255,255,0.2);">
                <svg width="20" height="20" viewBox="0 0 42 42" fill="none">
                    <path d="M12 30 Q14 18 21 14 Q28 10 30 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <circle cx="30" cy="12" r="3" fill="#9FE1CB"/>
                </svg>
            </div>
            <div class="bot-info">
                <h4>Writely Concierge</h4>
                <p>AI Assistant • Always Online</p>
            </div>
        </div>
        <div id="aiMessages" class="support-messages"></div>
        <div class="support-footer">
            <input type="text" id="supportInput" placeholder="Ask about payments, levels...">
            <button onclick="askAI()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</body>
</html>

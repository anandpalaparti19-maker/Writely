[build]
  # We publish the root to ensure relative paths to /shared/ and /apps/ work correctly
  publish = "."

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirect the root domain to the seeker-web landing page
[[redirects]]
  from = "/"
  to = "/apps/seeker-web/index.html"
  status = 200

# Ensure all frontend apps are accessible
[[redirects]]
  from = "/seeker/*"
  to = "/apps/seeker-web/:splat"
  status = 200

[[redirects]]
  from = "/writer/*"
  to = "/apps/writer-mobile/:splat"
  status = 200

# Security: Block access to sensitive backend files & folders
# (Netlify does not support status codes under [[headers]] — must use [[redirects]] with force)
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/gateway/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/services/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

# Security headers applied to ALL pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
